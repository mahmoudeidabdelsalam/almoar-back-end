name: Deploy Almoar WordPress Theme

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: almoar-wordpress-theme-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy WordPress Theme
    runs-on: ubuntu-latest

    steps:
      # 1. Prepare SSH
      - name: Setup SSH
        env:
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$SSH_KEY_B64" ]; then
            echo "Missing DEPLOY_SSH_KEY_B64 secret"
            exit 1
          fi

          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "Missing DEPLOY_KNOWN_HOSTS secret"
            exit 1
          fi

          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH configuration completed."

      # 2. Test SSH connection
      - name: Test SSH Connection
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH connection successful"'

      # 3. Deploy WordPress Theme
      - name: Deploy WordPress Theme
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'

          set -euo pipefail

          THEME_DIR="/home/art/public_html/wp-content/themes/theme-headless"

          echo "Checking deployment user..."
          whoami

          if [ "$(whoami)" != "art" ]; then
            echo "Deployment must run as user art."
            exit 1
          fi

          cd "$THEME_DIR"

          echo "Checking Git repository..."
          git status --short
          git remote -v

          echo "Fetching latest changes..."
          git fetch origin main

          echo "Deploying latest theme..."
          git reset --hard origin/main

          echo "Checking deployed commit..."
          git log -1 --oneline

          echo "WordPress theme deployment completed successfully."

          REMOTE