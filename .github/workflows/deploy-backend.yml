name: Deploy Almoar WordPress Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: almoar-wordpress-theme-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy WordPress Theme
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        env:
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "whoami"

      - name: Deploy Theme
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash -se' <<'REMOTE'
              set -euo pipefail

              THEME_DIR="/home/art/public_html/wp-content/themes/theme-headless"

              echo "Deploying WordPress theme..."

              cd "$THEME_DIR"

              git fetch origin main
              git reset --hard origin/main

              echo "Deployment completed successfully."
              git log -1 --oneline
          REMOTE